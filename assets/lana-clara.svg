<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="52%" stop-color="#053b2c"/>
      <stop offset="100%" stop-color="#091916"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="22%" cy="16%" r="58%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="84%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="bellGrad" cx="38%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#6ee7b7" fill-opacity="0.11"/>
    </pattern>
    <filter id="softShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#02110c" flood-opacity="0.42"/>
    </filter>
    <filter id="bellShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#02110c" flood-opacity="0.42"/>
    </filter>
    <mask id="sheepCutHD">
      <rect width="64" height="64" fill="#ffffff"/>
      <path d="M21 26 C21 21, 43 21, 43 26 L41 37 C40 43, 24 43, 23 37 Z" fill="#000000"/>
      <path d="M21 26 L13 31 C15 34, 19 33, 22 30 Z" fill="#000000"/>
      <path d="M43 26 L51 31 C49 34, 45 33, 42 30 Z" fill="#000000"/>
    </mask>
  </defs>

  <!-- Fondo Emerald Liquid Glass (full-bleed para Play Store e íconos) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#emeraldGlow)"/>
  <rect width="1024" height="1024" fill="url(#goldGlow)"/>
  <rect width="1024" height="1024" fill="url(#dotGrid)"/>

  <!-- Emblema exacto de la ovejita v5 escalado a Super HD -->
  <g transform="translate(128, 120) scale(12)" filter="url(#softShadow)">
    <g mask="url(#sheepCutHD)" fill="url(#woolGrad)">
      <circle cx="32" cy="18" r="9"/>
      <circle cx="20" cy="22" r="8"/>
      <circle cx="44" cy="22" r="8"/>
      <circle cx="15" cy="33" r="8"/>
      <circle cx="49" cy="33" r="8"/>
      <circle cx="21" cy="43" r="8"/>
      <circle cx="43" cy="43" r="8"/>
      <circle cx="32" cy="46" r="8"/>
    </g>
    <path
      d="M21 46 Q32 53 43 46"
      fill="none"
      stroke="url(#collarGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <g filter="url(#bellShadow)">
      <circle cx="32" cy="52" r="4.6" fill="url(#bellGrad)"/>
      <circle cx="30.6" cy="50.5" r="1.2" fill="#fef3c7" fill-opacity="0.85"/>
    </g>
  </g>
</svg>
